services:
  - type: web
    name: chatly-api
    runtime: docker
    repo: https://github.com/YOUR_GITHUB_USER/chatly
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 3000
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1

databases:
  - name: chatly-db
    databaseName: chatly
    user: chatly
    plan: free