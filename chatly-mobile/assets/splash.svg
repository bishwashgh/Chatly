<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6CF7"/>
      <stop offset="100%" stop-color="#34C1B0"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4A6CF7" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Light background -->
  <rect width="1242" height="2688" fill="#F5F5F7"/>

  <!-- Centered Logo Mark (Y center ~ 1240) -->
  <g transform="translate(521, 1144)" filter="url(#logoShadow)">
    <!-- 200x200 Squircle with indigo-teal gradient -->
    <rect width="200" height="200" rx="58" ry="58" fill="url(#logoGrad)"/>
    
    <!-- White Speech Bubble with friendly figures -->
    <g transform="translate(100, 100) scale(0.19) translate(-512, -502)">
      <path d="M 512,232 C 346.3,232 212,352.8 212,502 C 212,568.2 238.2,628.9 282.5,677.3 L 246,804 C 243.2,813.8 253.2,822.4 262.3,817.5 L 401.4,742.6 C 436.8,754.9 473.8,762 512,762 C 677.7,762 812,641.2 812,502 C 812,352.8 677.7,232 512,232 Z" fill="#FFFFFF"/>
      <!-- Overlapping Friends Icon -->
      <circle cx="436" cy="442" r="54" fill="#4A6CF7"/>
      <path d="M 334,576 C 334,524 380,498 436,498 C 492,498 538,524 538,576 Z" fill="#4A6CF7"/>

      <circle cx="580" cy="426" r="66" fill="#FFFFFF"/>
      <path d="M 466,576 C 466,516 516,482 580,482 C 644,482 694,516 694,576 Z" fill="#FFFFFF"/>
      
      <circle cx="580" cy="426" r="54" fill="#34C1B0"/>
      <path d="M 478,576 C 478,524 524,494 580,494 C 636,494 682,524 682,576 Z" fill="#34C1B0"/>
    </g>
  </g>

  <!-- Wordmark "Chatly" directly below icon -->
  <text x="621" y="1410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="52" font-weight="800" fill="#1C1C1E" letter-spacing="-0.5">Chatly</text>
</svg>
