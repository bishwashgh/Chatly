# Render Blueprint: Chatly API + PostgreSQL + Redis
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates all 3 services in one go.
#
# After the first deploy, set the remaining secrets on the `chatly-api`
# service (Environment tab):
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   GOOGLE_CLIENT_ID, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_URL,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#
# DATABASE_URL and REDIS_URL are wired automatically below via fromService.

services:
  # ---------- Backend API (NestJS + GraphQL) ----------
  - type: web
    name: chatly-api
    runtime: node
    rootDir: chatly_backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: sh prisma/migrations/bootstrap.sh && node dist/main.js
    healthCheckPath: /graphql
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: chatly-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatly-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Checksum of prisma/migrations/001_initial/migration.sql (SHA-256).
      # Used by bootstrap.sh to mark the initial migration as applied
      # on a database that was previously created by `prisma db push`.
      - key: INITIAL_MIGRATION_CHECKSUM
        value: dc85577f21e1c75200e5b90cc8e745dad994a42bad42e79b072c83599d41400a
    # Real-time (subscriptions over WebSocket) needs websockets enabled:
    # Dashboard → chatly-api → Settings → WebSockets → ON
    # Schema is applied via the startup script (prisma/migrations/bootstrap.sh)
    # which runs on every deploy. The first deploy creates the prisma_migrations
    # tracking table and marks the 001_initial migration as applied (safe —
    # no data is dropped). After that, only `prisma migrate deploy` runs,
    # applying new migrations as you add them.
    #
    # The INITIAL_MIGRATION_CHECKSUM env var is the SHA-256 of
    # prisma/migrations/001_initial/migration.sql — used to mark the baseline.

  # ---------- PostgreSQL ----------
  - type: pserv
    name: chatly-postgres
    runtime: postgresql
    plan: free
    databaseName: chatly
    databaseUser: chatly

  # ---------- Redis (Key Value) ----------
  - type: keyvalue
    name: chatly-redis
    plan: free
    maxmemoryPolicy: noeviction
